<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vela Terminal — TradingView</title>
<style>
  :root { color-scheme: dark; --bg:#0b0e14; --panel:#11151f; --panel2:#161b28; --line:#1f2533; --txt:#d1d5db; --dim:#6b7280; --up:#26a69a; --dn:#ef5350; --acc:#f59e0b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--txt); font-size:14px; }
  header { display:flex; gap:8px; padding:8px 12px; align-items:center; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header input, header select, header button { background:var(--panel2); color:var(--txt); border:1px solid #2a3244; border-radius:6px; padding:5px 9px; font-size:13px; }
  header input#symbol { width:140px; text-transform:uppercase; }
  header button { cursor:pointer; } header button:hover { background:#232b40; }
  header button.on { border-color:var(--acc); color:var(--acc); }
  #quote { margin-left:auto; font-variant-numeric:tabular-nums; }
  #quote .px { font-weight:700; font-size:17px; }
  .up{color:var(--up)} .dn{color:var(--dn)}
  main { display:grid; grid-template-columns: 240px 1fr 300px; gap:0; height: calc(100vh - 46px); }
  @media(max-width:1000px){ main { grid-template-columns: 1fr; height:auto; } .side{max-height:300px} }
  .side { border-right:1px solid var(--line); background:var(--panel); overflow-y:auto; padding:6px; }
  .side h3 { margin:8px 4px 6px; font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; display:flex; justify-content:space-between; align-items:center; }
  .side h3 button { background:none; border:none; color:var(--dim); cursor:pointer; font-size:14px; padding:0 4px; }
  .wrow { display:flex; justify-content:space-between; align-items:center; padding:5px 7px; border-radius:6px; cursor:pointer; gap:4px; }
  .wrow:hover, .wrow.active { background:var(--panel2); }
  .wrow .s { font-weight:600; font-size:12.5px; flex:1; }
  .wrow .p { font-variant-numeric:tabular-nums; font-size:12.5px; text-align:right; }
  .wrow .c { font-size:11.5px; text-align:right; min-width:52px; }
  .wrow .x { color:var(--dim); font-size:11px; cursor:pointer; padding:0 2px; } .wrow .x:hover{color:var(--dn)}
  #chartcol { display:flex; flex-direction:column; overflow:hidden; }
  #indbar { display:flex; gap:6px; padding:6px 10px; flex-wrap:wrap; border-bottom:1px solid var(--line); background:var(--panel); }
  #indbar label { display:flex; gap:4px; align-items:center; font-size:12px; color:var(--dim); cursor:pointer; background:var(--panel2); padding:3px 8px; border-radius:6px; border:1px solid transparent; }
  #indbar label.on { border-color:var(--acc); color:var(--acc); }
  #indbar label input { display:none; }
  #cvwrap { flex:1; position:relative; }
  canvas { width:100%; height:100%; display:block; }
  #ohlc { position:absolute; top:6px; left:10px; font-size:12px; font-variant-numeric:tabular-nums; background:rgba(11,14,20,.75); padding:3px 8px; border-radius:6px; pointer-events:none; }
  #sig { padding:4px 10px; font-size:12px; color:var(--dim); border-top:1px solid var(--line); }
  .right { border-left:1px solid var(--line); background:var(--panel); overflow-y:auto; padding:8px; }
  @media(max-width:1000px){ .right{border-left:none} }
  .card { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:8px; }
  .card h4 { margin:0 0 6px; font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.4px; }
  .kv { display:flex; justify-content:space-between; padding:2px 0; font-size:12.5px; font-variant-numeric:tabular-nums; }
  .kv .k{color:var(--dim)}
  .badge { padding:1px 7px; border-radius:99px; font-size:11px; font-weight:700; }
  .b-buy{background:rgba(38,166,154,.15); color:var(--up)} .b-sell{background:rgba(239,83,80,.15); color:var(--dn)} .b-neu{background:rgba(107,114,128,.15); color:var(--dim)}
  #tracklist .trow { display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; font-variant-numeric:tabular-nums; }
  .empty { color:var(--dim); font-size:12px; padding:6px; text-align:center; }
  input.addw { width:100%; background:var(--panel2); border:1px solid #2a3244; color:var(--txt); border-radius:6px; padding:5px 8px; font-size:12px; margin-top:4px; }
</style>
</head>
<body>
<header>
  <input id="symbol" value="BIST:THYAO" placeholder="BIST:THYAO">
  <select id="tf">
    <option value="1">1dk</option><option value="5">5dk</option><option value="15">15dk</option>
    <option value="60">1s</option><option value="240">4s</option>
    <option value="1D" selected>1G</option><option value="1W">1H</option><option value="1M">1A</option>
  </select>
  <select id="range">
    <option value="100">100</option><option value="300" selected>300</option>
    <option value="500">500</option><option value="1000">1000</option>
  </select>
  <button id="load">Yükle</button>
  <button id="favbtn" title="Favorilere ekle/çıkar">☆</button>
  <span id="quote">—</span>
</header>
<main>
  <div class="side" id="left">
    <h3>★ Favoriler</h3><div id="favlist"><div class="empty">boş</div></div>
    <h3>Izleme Listesi <button id="addwbtn" title="Ekle">＋</button></h3>
    <div id="watchlist"></div>
    <input class="addw" id="addwinput" placeholder="BIST:ASELS ekle + Enter">
  </div>
  <div id="chartcol">
    <div id="indbar">
      <label data-ind="ema20"><input type="checkbox">EMA20</label>
      <label data-ind="ema50"><input type="checkbox">EMA50</label>
      <label data-ind="ema200"><input type="checkbox">EMA200</label>
      <label data-ind="bb"><input type="checkbox">Bollinger</label>
      <label data-ind="vwap"><input type="checkbox">VWAP</label>
      <label data-ind="rsi"><input type="checkbox">RSI(14)</label>
      <label data-ind="macd"><input type="checkbox">MACD</label>
      <label data-ind="vol"><input type="checkbox" checked>Hacim</label>
    </div>
    <div id="cvwrap"><canvas id="cv"></canvas><div id="ohlc"></div></div>
    <div id="sig">—</div>
  </div>
  <div class="right">
    <div class="card"><h4>Gösterge Özeti</h4><div id="summary"><div class="empty">veri yok</div></div></div>
    <div class="card"><h4>Teknik Sinyaller</h4><div id="signals"><div class="empty">veri yok</div></div></div>
    <div class="card"><h4>Takip Listesi (sinyal izleme)</h4>
      <div id="tracklist"><div class="empty">takip yok — izleme listesinden ＋t ile ekle</div></div>
      <div class="kv" style="margin-top:4px"><span class="k">otomatik tazeleme</span><span>60sn</span></div>
    </div>
  </div>
</main>
<script>
// ---------- durum ----------
const S = { bars: [], symbol: 'BIST:THYAO', tf: '1D', inds: new Set(['vol']), offset: 0, dragX: null, ws: null, quote: null };
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const LS = { get:(k,d)=>{try{return JSON.parse(localStorage.getItem('vela.'+k)) ?? d}catch{return d}}, set:(k,v)=>localStorage.setItem('vela.'+k, JSON.stringify(v)) };
let favs = LS.get('favs', ['BIST:THYAO','BIST:XU100','BINANCE:BTCUSDT']);
let watch = LS.get('watch', ['BIST:GARAN','BIST:ASELS','BIST:THYAO','BINANCE:ETHUSDT']);
let track = LS.get('track', []); // {symbol, note}

// ---------- indikatör matematiği ----------
const ema = (a, n) => { const k=2/(n+1), o=[]; let e=a[0]; a.forEach((v,i)=>{ e = i? v*k+e*(1-k) : v; o.push(e); }); return o; };
const sma = (a, n) => a.map((_,i)=> i<n-1? null : a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n);
const rsi = (c, n=14) => { const o=Array(n).fill(null); let g=0,l=0;
  for(let i=1;i<c.length;i++){ const d=c[i]-c[i-1]; const G=Math.max(d,0), L=Math.max(-d,0);
    if(i<=n){ g+=G; l+=L; if(i===n){ g/=n; l/=n; o.push(100-100/(1+g/(l||1e-9))); } }
    else { g=(g*(n-1)+G)/n; l=(l*(n-1)+L)/n; o.push(100-100/(1+g/(l||1e-9))); } }
  return o; };
const boll = (c, n=20, m=2) => { const mid=sma(c,n);
  return mid.map((v,i)=>{ if(v==null) return null; const w=c.slice(i-n+1,i+1);
    const sd=Math.sqrt(w.reduce((s,x)=>s+(x-v)**2,0)/n); return {mid:v, up:v+m*sd, lo:v-m*sd}; }); };
const vwapCalc = (bars) => { let pv=0,vv=0; return bars.map(b=>{ const t=new Date(b.time*1000).getUTCDate(); });
  // günlük bazda: session = bar zamanının UTC günü değişince sıfırla (intraday için anlamlı)
  let day=null,out=[]; bars.forEach(b=>{ const d=Math.floor(b.time/86400); if(d!==day){day=d;pv=0;vv=0;}
    const tp=(b.high+b.low+b.close)/3; pv+=tp*(b.volume||1); vv+=(b.volume||1); out.push(pv/vv); }); return out; };
const emacd = (c) => { const e12=ema(c,12), e26=ema(c,26);
  const macd=c.map((_,i)=>e12[i]-e26[i]); const sig=ema(macd,9);
  return {macd, sig, hist: macd.map((v,i)=>v-sig[i])}; };

// ---------- veri ----------
async function loadBars(sym=S.symbol, tf=S.tf) {
  const n = $('range').value;
  const r = await fetch(`/api/bars?symbol=${encodeURIComponent(sym)}&tf=${tf}&n=${n}`);
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j.bars.filter(b=>b.time);
}
async function load() {
  S.symbol = $('symbol').value.trim().toUpperCase(); S.tf = $('tf').value; S.offset = 0;
  $('sig').textContent = 'yükleniyor…';
  try { S.bars = await loadBars(); draw(); summarize(); connectQuote(S.symbol); refreshWatch(); refreshTrack();
        $('sig').textContent = `${S.symbol} — ${S.bars.length} bar (${S.tf}) | kaynak: TradingView`;
  } catch(e) { $('sig').textContent = 'HATA: '+e.message; }
}
// ---------- quote WS ----------
function connectQuote(sym) {
  if (S.ws) try{S.ws.close()}catch{}
  const proto = location.protocol==='https:'?'wss':'ws';
  S.ws = new WebSocket(`${proto}://${location.host}/ws/quote?symbols=${encodeURIComponent(sym)}`);
  S.ws.onmessage = ev => { const {quote:q} = JSON.parse(ev.data); if(!q||q.lp===undefined) return; S.quote=q; renderQuote();
    if (S.bars.length){ const l=S.bars[S.bars.length-1]; l.close=q.lp; l.high=Math.max(l.high,q.lp); l.low=Math.min(l.low,q.lp); draw(); }
    const prev = S.bars.length>1 ? S.bars[S.bars.length-2].close : q.lp;
    $('quote').innerHTML = `<span class="px ${q.chp>=0?'up':'dn'}">${q.lp}</span> <span class="${q.chp>=0?'up':'dn'}">${q.chp>=0?'+':''}${(q.chp??0).toFixed(2)}%</span>`;
  };
}
function renderQuote(){}
// ---------- çizim ----------
function resize(){ cv.width=cv.clientWidth*devicePixelRatio; cv.height=cv.clientHeight*devicePixelRatio; draw(); }
addEventListener('resize', resize);
function draw() {
  const b=S.bars; if(!b.length) return;
  const W=cv.width,H=cv.height, dp=devicePixelRatio;
  const vis=Math.min(140,b.length);
  const view=b.slice(Math.max(0,b.length-vis-S.offset), b.length-S.offset);
  if(!view.length) return;
  const closes=view.map(x=>x.close);
  let lo=Math.min(...view.map(x=>x.low)), hi=Math.max(...view.map(x=>x.high));
  const hasRSI=S.inds.has('rsi'), hasMACD=S.inds.has('macd'), hasVOL=S.inds.has('vol');
  const paneMain=H-(hasRSI?0.18*H:0)-(hasMACD?0.16*H:0)-(hasVOL?0.10*H:0);
  const pad=(hi-lo)*0.08||1; lo-=pad; hi+=pad;
  const padR=64*dp, padB=20*dp;
  const cw=(W-padR)/view.length;
  const Y=v=>paneMain*(1-(v-lo)/(hi-lo));
  ctx.fillStyle='#0b0e14'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#151b28'; ctx.fillStyle='#4b5563'; ctx.font=`${11*dp}px system-ui`;
  for(let i=0;i<=5;i++){ const v=lo+(hi-lo)*i/5, y=Y(v);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(v>1000? v.toFixed(0) : v.toFixed(2), W-padR+6, y+4); }
  // indikatör çizgileri (view hizalı)
  const allC=S.bars.map(x=>x.close);
  const line=(arr,col,ymap)=>{ ctx.strokeStyle=col; ctx.lineWidth=1.4*dp; ctx.beginPath(); let st=false;
    arr.forEach((v,i)=>{ if(v==null){st=false;return;} const x=i*cw+cw/2, y=ymap(v); st?ctx.lineTo(x,y):(ctx.moveTo(x,y),st=true); }); ctx.stroke(); ctx.lineWidth=1; };
  const idx0=Math.max(0,S.bars.length-view.length-S.offset);
  const vw=(arr)=>arr.slice(idx0, idx0+view.length);
  const yAll=v=>paneMain*(1-(v-lo)/(hi-lo)); // tüm seriyi view ölçeğine
  if(S.inds.has('ema20')) line(vw(ema(allC,20)),'#60a5fa',yAll);
  if(S.inds.has('ema50')) line(vw(ema(allC,50)),'#f472b6',yAll);
  if(S.inds.has('ema200')) line(vw(ema(allC,200)),'#a78bfa',yAll);
  if(S.inds.has('vwap')) line(vw(vwapCalc(S.bars)),'#fbbf24',yAll);
  if(S.inds.has('bb')){ const bb=boll(allC);
    line(vw(bb.map(x=>x?.up)),'rgba(96,165,250,.5)',yAll);
    line(vw(bb.map(x=>x?.mid)),'rgba(96,165,250,.35)',yAll);
    line(vw(bb.map(x=>x?.lo)),'rgba(96,165,250,.5)',yAll); }
  // mumlar
  view.forEach((bar,i)=>{ const up=bar.close>=bar.open, col=up?'#26a69a':'#ef5350';
    ctx.strokeStyle=col; ctx.fillStyle=col; const x=i*cw+cw/2;
    ctx.beginPath(); ctx.moveTo(x,Y(bar.high)); ctx.lineTo(x,Y(bar.low)); ctx.stroke();
    const bw=Math.max(cw*0.6,1), yo=Y(bar.open), yc=Y(bar.close);
    ctx.fillRect(x-bw/2,Math.min(yo,yc),bw,Math.max(Math.abs(yc-yo),1)); });
  // hacim paneli
  let y0=paneMain;
  if(hasVOL){ const vh=0.10*H, mv=Math.max(...view.map(x=>x.volume||0))||1;
    view.forEach((bar,i)=>{ const up=bar.close>=bar.open; ctx.fillStyle=up?'rgba(38,166,154,.4)':'rgba(239,83,80,.4)';
      const h=(bar.volume||0)/mv*vh; ctx.fillRect(i*cw+cw*0.2, y0+vh-h, cw*0.6, h); });
    ctx.fillStyle='#4b5563'; ctx.fillText('VOL', 4, y0+12*dp); y0+=vh; }
  if(hasRSI){ const vh=0.18*H, r=rsi(allC), vr=vw(r);
    ctx.strokeStyle='#1f2533'; ctx.strokeRect(0,y0,W-padR,vh);
    [30,70].forEach(l=>{ const y=y0+vh*(1-l/100); ctx.strokeStyle='#2a3244'; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W-padR,y); ctx.stroke(); });
    line(vr,'#f59e0b',v=>y0+vh*(1-v/100));
    ctx.fillStyle='#4b5563'; ctx.fillText('RSI  '+((vr.at(-1)??0).toFixed(1)), 4, y0+12*dp); y0+=vh; }
  if(hasMACD){ const vh=0.16*H, m=emacd(allC), vm=vw(m.hist), vmac=vw(m.macd), vsig=vw(m.sig);
    const mm=Math.max(...vm.map(Math.abs),1e-9);
    const ym=v=>y0+vh/2-v/mm*(vh/2-4*dp);
    ctx.strokeStyle='#1f2533'; ctx.strokeRect(0,y0,W-padR,vh);
    vm.forEach((v,i)=>{ ctx.fillStyle=v>=0?'rgba(38,166,154,.5)':'rgba(239,83,80,.5)';
      const y=ym(v); ctx.fillRect(i*cw+cw*0.2, Math.min(y,ym(0)), cw*0.6, Math.abs(y-ym(0))); });
    line(vmac,'#60a5fa',ym); line(vsig,'#f472b6',ym);
    ctx.fillStyle='#4b5563'; ctx.fillText('MACD', 4, y0+12*dp); }
  // zaman
  ctx.fillStyle='#4b5563';
  view.forEach((bar,i)=>{ if(i%Math.ceil(view.length/7)===0) ctx.fillText(new Date(bar.time*1000).toISOString().slice(0,10), i*cw, H-4); });
  // OHLC hover
  const cross=(e)=>{ const r=cv.getBoundingClientRect(); const i=Math.floor((e.clientX-r.left)*dp/cw);
    if(i>=0&&i<view.length){ const b2=view[i];
      $('ohlc').innerHTML=`<b>${S.symbol}</b> O:${b2.open} H:${b2.high} L:${b2.low} C:<span class="${b2.close>=b2.open?'up':'dn'}">${b2.close}</span> ${new Date(b2.time*1000).toISOString().slice(0,10)}`; } };
  cv.onmousemove=cross;
}
// ---------- özet + sinyaller ----------
function summarize(){
  const c=S.bars.map(x=>x.close); if(c.length<30) return;
  const last=c.at(-1);
  const e20=ema(c,20).at(-1), e50=ema(c,50).at(-1), e200=ema(c,200).at(-1)??e50;
  const r=rsi(c).at(-1)??50;
  const m=emacd(c), mh=m.hist.at(-1);
  const bb=boll(c).at(-1);
  const hi52=Math.max(...S.bars.slice(-252).map(x=>x.high)), lo52=Math.min(...S.bars.slice(-252).map(x=>x.low));
  const sig=(cond,buy,sell)=>cond?['AL',buy]:['SAT',sell];
  const rows=[
    ['Fiyat', last, ''],
    ['EMA20', e20.toFixed(2), last>e20?'up':'dn'],
    ['EMA50', e50.toFixed(2), last>e50?'up':'dn'],
    ['EMA200', e200.toFixed(2), last>e200?'up':'dn'],
    ['RSI(14)', r.toFixed(1), r>70?'dn':r<30?'up':''],
    ['MACD hist', mh.toFixed(3), mh>0?'up':'dn'],
    ['Bollinger', bb?`${bb.lo.toFixed(1)} – ${bb.up.toFixed(1)}`:'—', ''],
    ['52H Yüksek', hi52.toFixed(2), 'dn'],
    ['52H Düşük', lo52.toFixed(2), 'up'],
  ];
  $('summary').innerHTML = rows.map(([k,v,cl])=>`<div class="kv"><span class="k">${k}</span><span class="${cl}">${v}</span></div>`).join('');
  // sinyaller
  const sigs=[
    ['EMA20/50 kesişim', e20>e50?'AL (golden)':'SAT (death)', e20>e50],
    ['EMA200 üstünde', last>e200, 'Fiyat > EMA200'],
    ['RSI', r>70?('AŞIRI ALIŞ '+r.toFixed(0)):r<30?('AŞIRI SATIŞ '+r.toFixed(0)):'Nötr '+r.toFixed(0), r<70&&r>30],
    ['MACD', mh>0?'AL (hist +)':'SAT (hist −)', mh>0],
    ['Bollinger', bb?(last>bb.up?'Üst bant üstü':last<bb.lo?'Alt bant altı':'Band içi'):'—', bb&&last<bb.up&&last>bb.lo],
  ];
  $('signals').innerHTML = sigs.map(([n,v,ok])=>{
    const b=typeof v==='boolean' ? (v?['AL','b-buy']:['SAT','b-sell']) : (String(v).startsWith('AŞIRI ALIŞ')||String(v).startsWith('SAT')?['SAT','b-sell']:String(v).startsWith('AŞIRI SATIŞ')||String(v).startsWith('AL')?['AL','b-buy']:['NÖTR','b-neu']);
    return `<div class="kv"><span class="k">${n}</span><span>${typeof v==='boolean'?'':v} <span class="badge ${b[1]}">${b[0]}</span></span></div>`;
  }).join('');
  const bull=sigs.filter(s=>s[1]===true||String(s[1]).startsWith('AL')).length;
  const bear=sigs.filter(s=>s[1]===false||String(s[1]).startsWith('SAT')).length;
  $('sig').textContent = `Sinyal dengesi: ${bull} AL / ${bear} SAT — ${bull>bear?'NET AL YÖNLÜ':bear>bull?'NET SAT YÖNLÜ':'KARARSIZ'}`;
}
// ---------- listeler ----------
function wrowHTML(sym, q, extra='') {
  const chg=q?.chp, px=q?.lp;
  return `<div class="wrow ${sym===S.symbol?'active':''}" data-sym="${sym}">
    <span class="s">${sym}</span>
    <span class="p ${chg>=0?'up':'dn'}">${px??'…'}</span>
    <span class="c ${chg>=0?'up':'dn'}">${chg!=null?(chg>=0?'+':'')+chg.toFixed(1)+'%':'…'}</span>
    ${extra}</div>`;
}
function renderFavs(){ $('favlist').innerHTML = favs.length? favs.map(s=>wrowHTML(s, wq[s], `<span class="x" data-del="${s}">✕</span>`)).join('') : '<div class="empty">boş</div>'; }
function renderWatch(){ $('watchlist').innerHTML = watch.length? watch.map(s=>wrowHTML(s, wq[s], `<span class="x" data-del="${s}">✕</span>`)).join('') : '<div class="empty">boş</div>'; }
function renderTrack(){ $('tracklist').innerHTML = track.length? track.map(t=>{
    const q=wq[t.symbol], r=t.rsi;
    return `<div class="trow"><span>${t.symbol}</span><span class="${(q?.chp??0)>=0?'up':'dn'}">${q?.lp??'…'} ${r!=null?`<span class="badge ${r>70?'b-sell':r<30?'b-buy':'b-neu'}">${r.toFixed(0)}</span>`:''}</span><span class="x" data-deltr="${t.symbol}">✕</span></div>`;
  }).join('') : '<div class="empty">takip yok</div>'; }
// watch quote havuzu
let wq = {};
async function refreshWatch(){
  const all=[...new Set([S.symbol,...favs,...watch,...track.map(t=>t.symbol)])];
  for(const s of all){ if(s===S.symbol&&S.quote){ wq[s]=S.quote; continue; }
    try{ const r=await fetch(`/api/bars?symbol=${encodeURIComponent(s)}&tf=1D&n=2`); const j=await r.json();
      if(j.bars?.length>=2){ const [y,t]=j.bars.slice(-2); wq[s]={lp:t.close, chp:(t.close-y.close)/y.close*100}; } }catch{} }
  renderFavs(); renderWatch(); renderTrack();
}
async function refreshTrack(){ // track'e RSI ekle
  for(const t of track){ try{ const bars=await loadBars(t.symbol,'1D');
    const r=rsi(bars.map(b=>b.close)).at(-1); t.rsi = r??null;
    t.sig = r>70?'AŞIRI ALIŞ':r<30?'AŞIRI SATIŞ':'nötr'; }catch{ t.rsi=null; } }
  LS.set('track',track); renderTrack();
}
// ---------- olaylar ----------
$('load').onclick=load;
$('symbol').addEventListener('keydown',e=>{ if(e.key==='Enter') load(); });
$('favbtn').onclick=()=>{ const s=S.symbol;
  if(favs.includes(s)) favs=favs.filter(x=>x!==s); else favs.push(s);
  LS.set('favs',favs); renderFavs(); refreshWatch();
  $('favbtn').textContent=favs.includes(s)?'★':'☆'; $('favbtn').classList.toggle('on',favs.includes(s)); };
$('addwbtn').onclick=()=>{ const s=$('addwinput').value.trim().toUpperCase(); if(s&&!watch.includes(s)){watch.push(s);LS.set('watch',watch);$('addwinput').value='';renderWatch();refreshWatch();} };
$('addwinput').addEventListener('keydown',e=>{ if(e.key==='Enter') $('addwbtn').click(); });
document.body.addEventListener('click',e=>{
  const row=e.target.closest('.wrow'); if(row&&!e.target.dataset.del) { $('symbol').value=row.dataset.sym; load(); }
  const del=e.target.dataset.del; if(del){ favs=favs.filter(x=>x!==del); watch=watch.filter(x=>x!==del); LS.set('favs',favs); LS.set('watch',watch); renderFavs(); renderWatch(); }
  const dt=e.target.dataset.deltr; if(dt){ track=track.filter(t=>t.symbol!==dt); LS.set('track',track); renderTrack(); }
});
document.querySelectorAll('#indbar label').forEach(l=>{ const cb=l.querySelector('input');
  cb.checked=S.inds.has(l.dataset.ind); l.classList.toggle('on',cb.checked);
  cb.onchange=()=>{ cb.checked?S.inds.add(l.dataset.ind):S.inds.delete(l.dataset.ind); l.classList.toggle('on',cb.checked); draw(); }; });
cv.addEventListener('wheel',e=>{ e.preventDefault(); S.offset=Math.min(Math.max(0,S.offset+(e.deltaY>0?20:-20)),S.bars.length-30); draw(); },{passive:false});
cv.addEventListener('mousedown',e=>S.dragX=e.clientX);
addEventListener('mousemove',e=>{ if(S.dragX!==null){ S.offset=Math.min(Math.max(0,S.offset+Math.round((e.clientX-S.dragX)/5)),S.bars.length-30); S.dragX=e.clientX; draw(); } });
addEventListener('mouseup',()=>S.dragX=null);
// ---------- başlat ----------
resize(); load();
setInterval(()=>{ if(S.bars.length) load(); }, 60000);
setInterval(refreshTrack, 120000);
</script>
</body>
