<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vela Terminal — TradingView</title>
<style>
  :root { color-scheme: dark; --bg:#0b0e14; --panel:#11151f; --panel2:#161b28; --line:#1f2533; --txt:#d1d5db; --dim:#6b7280; --up:#26a69a; --dn:#ef5350; --acc:#f59e0b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--txt); font-size:14px; overflow:hidden; }
  header { display:flex; gap:8px; padding:8px 12px; align-items:center; background:var(--panel); border-bottom:1px solid var(--line); height:46px; }
  header input, header button { background:var(--panel2); color:var(--txt); border:1px solid #2a3244; border-radius:6px; padding:5px 9px; font-size:13px; }
  header input#symbol { width:150px; text-transform:uppercase; }
  header button { cursor:pointer; } header button:hover { background:#232b40; }
  header button.on { border-color:var(--acc); color:var(--acc); }
  .up{color:var(--up)} .dn{color:var(--dn)}
  main { display:grid; grid-template-columns: 250px 1fr; height: calc(100% - 46px); }
  @media(max-width:900px){ main { grid-template-columns: 1fr; grid-template-rows: 200px 1fr; } .side{ border-right:none; } }
  .side { border-right:1px solid var(--line); background:var(--panel); overflow-y:auto; padding:6px; }
  .side h3 { margin:8px 4px 6px; font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; }
  .wrow { display:flex; justify-content:space-between; align-items:center; padding:5px 7px; border-radius:6px; cursor:pointer; gap:4px; }
  .wrow:hover, .wrow.active { background:var(--panel2); }
  .wrow .s { font-weight:600; font-size:12.5px; flex:1; }
  .wrow .p { font-variant-numeric:tabular-nums; font-size:12.5px; text-align:right; }
  .wrow .c { font-size:11.5px; text-align:right; min-width:52px; }
  .wrow .x { color:var(--dim); font-size:11px; cursor:pointer; padding:0 2px; } .wrow .x:hover{color:var(--dn)}
  #chartwrap { position:relative; overflow:hidden; }
  #chartwrap iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .empty { color:var(--dim); font-size:12px; padding:6px; text-align:center; }
  input.addw { width:100%; background:var(--panel2); border:1px solid #2a3244; color:var(--txt); border-radius:6px; padding:5px 8px; font-size:12px; margin-top:4px; }
</style>
</head>
<body>
<header>
  <input id="symbol" value="BIST:THYAO" placeholder="BIST:THYAO">
  <button id="load">Yükle</button>
  <button id="favbtn" title="Favorilere ekle/çıkar">☆</button>
  <span style="flex:1"></span>
  <span style="font-size:12px;color:var(--dim)">Sol çubuk: çizim araçları (trend, Fibonacci, şekiller) | üst: indikatörler</span>
</header>
<main>
  <div class="side">
    <h3>★ Favoriler</h3><div id="favlist"><div class="empty">boş</div></div>
    <h3>İzleme Listesi</h3>
    <div id="watchlist"></div>
    <input class="addw" id="addwinput" placeholder="BIST:ASELS ekle + Enter">
  </div>
  <div id="chartwrap"><iframe id="tvframe" allow="clipboard-write" allowfullscreen></iframe></div>
</main>
<script>
const $ = id => document.getElementById(id);
const LS = { get:(k,d)=>{try{return JSON.parse(localStorage.getItem('vela.'+k)) ?? d}catch{return d}}, set:(k,v)=>localStorage.setItem('vela.'+k, JSON.stringify(v)) };
let favs = LS.get('favs', ['BIST:THYAO','BIST:XU100','BINANCE:BTCUSDT']);
let watch = LS.get('watch', ['BIST:GARAN','BIST:ASELS','BIST:THYAO','BINANCE:ETHUSDT']);
let wq = {};

// TradingView resmi embed — tam ekran iframe, hide_side_toolbar=0 → çizim araçları açık, "studies" ile hazır indikatörler
// studies parametresi embed'de %@ ile tekrarlanır
const STUDIES = [
  'STD;EMA','STD;RSI','STD;MACD','STD;Bollinger_Bands','STD;VWAP','STD;Volume'
];
function chartURL(sym) {
  const st = STUDIES.map(s=>`&studies=${encodeURIComponent(s)}`).join('');
  return `https://s.tradingview.com/widgetembed/?symbol=${encodeURIComponent(sym)}&interval=D&theme=dark&style=1&locale=tr&timezone=Europe/Istanbul&hide_side_toolbar=0&allow_symbol_change=1&withdateranges=1&details=0&hotlist=0&calendar=0&hide_legend=1&hide_volume=0&save_image=1&backgroundColor=%230b0e14&gridColor=%231f2533${st}`;
}
function load(){
  const sym = $('symbol').value.trim().toUpperCase();
  $('tvframe').src = chartURL(sym);
  refreshWatch();
}
// izleme listesi quote (bizim API — hafif)
async function refreshWatch(){
  const all=[...new Set([...favs,...watch])];
  for(const s of all){
    try{ const r=await fetch(`/api/bars?symbol=${encodeURIComponent(s)}&tf=1D&n=2`); const j=await r.json();
      if(j.bars?.length>=2){ const [y,t]=j.bars.slice(-2); wq[s]={lp:t.close, chp:(t.close-y.close)/y.close*100}; } }catch{} }
  renderFavs(); renderWatch();
}
function wrowHTML(sym, q, extra='') {
  const chg=q?.chp, px=q?.lp;
  return `<div class="wrow" data-sym="${sym}">
    <span class="s">${sym}</span>
    <span class="p ${chg>=0?'up':'dn'}">${px??'…'}</span>
    <span class="c ${chg>=0?'up':'dn'}">${chg!=null?(chg>=0?'+':'')+chg.toFixed(1)+'%':'…'}</span>
    ${extra}</div>`;
}
function renderFavs(){ $('favlist').innerHTML = favs.length? favs.map(s=>wrowHTML(s, wq[s], `<span class="x" data-del="${s}">✕</span>`)).join('') : '<div class="empty">boş</div>'; }
function renderWatch(){ $('watchlist').innerHTML = watch.length? watch.map(s=>wrowHTML(s, wq[s], `<span class="x" data-del="${s}">✕</span>`)).join('') : '<div class="empty">boş</div>'; }

$('load').onclick=load;
$('symbol').addEventListener('keydown',e=>{ if(e.key==='Enter') load(); });
$('favbtn').onclick=()=>{ const s=$('symbol').value.trim().toUpperCase();
  if(favs.includes(s)) favs=favs.filter(x=>x!==s); else favs.push(s);
  LS.set('favs',favs); renderFavs();
  $('favbtn').textContent=favs.includes(s)?'★':'☆'; $('favbtn').classList.toggle('on',favs.includes(s)); };
$('addwinput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ const s=$('addwinput').value.trim().toUpperCase();
  if(s&&!watch.includes(s)){watch.push(s);LS.set('watch',watch);$('addwinput').value='';renderWatch();refreshWatch();} } });
document.body.addEventListener('click',e=>{
  const row=e.target.closest('.wrow'); if(row&&!e.target.dataset.del){ $('symbol').value=row.dataset.sym; load(); }
  const del=e.target.dataset.del; if(del){ favs=favs.filter(x=>x!==del); watch=watch.filter(x=>x!==del); LS.set('favs',favs); LS.set('watch',watch); renderFavs(); renderWatch(); }
});
renderFavs(); renderWatch();
load();
setInterval(refreshWatch, 60000);
</script>
</body>
</html>
