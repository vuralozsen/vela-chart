services:
  vela-chart:
    image: node:22-alpine
    container_name: vela-chart
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --omit=dev --no-audit --no-fund && node server.mjs"
    ports:
      - "127.0.0.1:3010:3010"
    environment:
      - PORT=3010
      - NODE_ENV=production
    volumes:
      - ./:/app
    mem_limit: 512m
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
